version: '3.9'
services:
  postgres:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: v1
    hostname: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - backend_network

  backend:
    build: ./backend
    ports:
      - 8081:8081
    environment:
      DB_URL: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: v1
    depends_on:
      - postgres
    networks:
      - backend_network
      - frontend_network

  frontend:
    build: ./frontend
    ports:
      - 3000:80
    environment:
      VITE_APP_TITLE: development
      VITE_API_URL: localhost:8081
    depends_on:
      - backend
    networks:
      - frontend_network

volumes:
  postgres_data:

networks:
  backend_network:
  frontend_network:
